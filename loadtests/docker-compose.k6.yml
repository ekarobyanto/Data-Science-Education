version: '3.8'
services:
  k6:
    image: grafana/k6:latest
    volumes:
      - ..:/workspace:ro
      - ./k6:/scripts:ro
    working_dir: /workspace
    entrypoint: ["k6"]
    command: ["run", "/scripts/${K6_SCRIPT:-predict.js}"]
    environment:
      - BASE_URL=http://backend:5000
      - K6_VUS=${K6_VUS:-10}
      - K6_DURATION=${K6_DURATION:-30s}
      - K6_RATE=${K6_RATE:-50}
      - K6_PRE_ALLOCATED_VUS=${K6_PRE_ALLOCATED_VUS:-10}
      - K6_MAX_VUS=${K6_MAX_VUS:-100}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    external: true
